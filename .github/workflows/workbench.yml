name: CPU workflow checks
on:
  push:
    branches: ['codex/**', main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: deploy/requirements-workbench-mac.txt
      - run: python -m pip install -r deploy/requirements-workbench-mac.txt
      - run: PYTHONPATH=src python -m pytest -q
