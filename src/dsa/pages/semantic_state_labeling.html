<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f7;color:#192b3b;font:16px/1.65 system-ui,sans-serif}main{max-width:1200px;margin:auto;padding:25px 20px 50px}h1{font-size:27px;margin:12px 0}h2{font-size:21px;margin:4px 0}a{color:#145b94}p{margin:8px 0}
button,input{font:inherit;color:inherit;background:white;border:1px solid #aebdcc;border-radius:6px;padding:8px 12px}button{cursor:pointer}button:disabled{opacity:.4}button:focus-visible,input:focus-visible{outline:3px solid #d79222;outline-offset:2px}.primary{background:#145b94;color:white;border-color:#145b94}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.notice{padding:13px 16px;margin:15px 0;background:#fff2d6;border:1px solid #e4d1a5;border-radius:8px}.muted{font-size:14px;color:#53667b}.layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:18px;margin-top:18px}.state-list{display:flex;flex-direction:column;gap:8px}.state-list button{text-align:left}.state-list button[aria-current=true]{border-color:#145b94;background:#e5f0fa;box-shadow:inset 3px 0 #145b94}.panel{background:white;padding:20px;border:1px solid #d8e0e7;border-radius:10px}
.choices button{border:2px solid transparent;background:var(--bg);color:var(--fg)}.choices button[aria-checked=true]{border-color:var(--fg);box-shadow:0 0 0 1px var(--fg)}.preview{position:relative;margin-top:12px}video{width:100%;max-height:420px;background:#101820;border-radius:8px}.live{margin:8px 0;font-size:18px;font-weight:650}.examples{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:12px}.examples button{padding:5px}.examples button[aria-pressed=true]{border:2px solid #145b94}.examples img{width:100%;height:190px;object-fit:contain;background:#eef2f5}.examples span{display:block;font-size:13px}.timeline{display:flex;flex-wrap:wrap;gap:4px;margin:12px 0}.timeline button{font-size:12px;padding:5px 7px;background:#edf2f6}.notes{width:100%;margin:10px 0}#status{min-height:24px}.error{color:#b12d22}input[type=file]{max-width:265px;font-size:13px}.mapping-table{width:100%;border-collapse:collapse;margin-top:15px}.mapping-table td,.mapping-table th{padding:9px;text-align:left;border-bottom:1px solid #ddd}@media(max-width:750px){.layout{grid-template-columns:1fr}.state-list{flex-direction:row;overflow:auto}.state-list button{min-width:155px}.panel{padding:13px}.examples img{height:140px}}
.kind-choices{margin:12px 0}.kind-choices button[aria-checked=true]{background:#145b94;color:white;border-color:#145b94}.type-hint{padding:9px 12px;background:#edf4f9;border-radius:6px;font-size:14px;margin:9px 0}
</style></head><body><main>
<div class="row between"><a href="../">← 原模型报告</a><div class="row"><a href="/projects/camera05/2025_1830/state-labeling/">旧8秒示例 · 5状态</a><a href="/projects/camera05_custom/state-labeling/">81段正式模型 · 8状态</a></div></div>
<h1>__TITLE__</h1><p id="context" class="muted"></p><div class="notice">沿用已有MoSeq状态和原始边界，由你定义标识。单一阶段选择准备、引拍、挥拍、随挥或回位/移动；包含多个阶段的状态可多选“混合阶段”。与训练目标无关或轨迹异常的状态可标“无效动作”，拿不准时选“无法判断”。</div>
<div class="row between"><strong id="progress"></strong><div class="row"><button id="export" class="primary">导出状态命名</button><label>恢复命名 <input id="import" type="file" accept=".json,application/json"></label></div></div>
<p id="status" role="status" aria-live="polite"></p><div class="layout"><nav id="states" class="state-list" aria-label="已有模型状态"></nav><section id="panel" class="panel"></section></div>
<h2>你定义的状态标识</h2><table class="mapping-table"><thead><tr><th>原状态</th><th>你定义的标识</th><th>确认情况</th></tr></thead><tbody id="mapping-table"></tbody></table>
<p class="muted">映射绑定当前模型与帧率。确认的单一阶段可用于阶段标签；混合、无效及无法判断的状态不作为单阶段训练标签。混合阶段不会自动拆出内部边界，原始帧号仍保留。导出后交回当前聊天，即可应用同一模型的标识。</p>
</main><script type="application/json" id="config">__CONFIG__</script><script>
'use strict';const q=JSON.parse(document.getElementById('config').textContent),$=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const key='moseq-user-state-names-v1:'+q.mapping_key,phases=q.phase_schema.phases;
const kinds={single:'单一阶段',mixed:'混合阶段',invalid:'无效动作',uncertain:'无法判断'};
let saved={active:q.states[0].id,mappings:{}};try{saved=JSON.parse(localStorage.getItem(key)||JSON.stringify(saved))}catch(e){}
for(const s of q.states)if(!saved.mappings[s.id])saved.mappings[s.id]={phase:'',reviewed:false,notes:''};
for(const m of Object.values(saved.mappings)){if(m.annotation_type===undefined)m.annotation_type=phases.includes(m.phase)?'single':'';if(!Array.isArray(m.mixed_phases))m.mixed_phases=[];}
if(!q.states.some(s=>s.id===saved.active))saved.active=q.states[0].id;
let player=null,currentClip=null,currentExample=0,stopAt=null;
const definition=()=>saved.mappings[saved.active],selectedState=()=>q.states.find(s=>s.id===saved.active);
const labelOf=m=>m?.annotation_type==='mixed'?'混合阶段'+(m.mixed_phases.length?'：'+m.mixed_phases.join('＋'):''):m?.annotation_type==='invalid'?'无效动作':m?.annotation_type==='uncertain'?'无法判断':m?.phase||'待定义';
const complete=m=>m.annotation_type==='single'?phases.includes(m.phase):m.annotation_type==='mixed'?m.mixed_phases.length>=2:['invalid','uncertain'].includes(m.annotation_type);
function update(){const done=q.states.filter(s=>saved.mappings[s.id].reviewed&&complete(saved.mappings[s.id])).length;$('#progress').textContent=`已确认 ${done} / ${q.states.length} 个状态`;
 [...$('#states').children].forEach((b,i)=>{const s=q.states[i],m=saved.mappings[s.id];b.setAttribute('aria-current',String(s.id===saved.active));b.textContent=`${m.reviewed?'✓ ':'○ '}状态 ${s.id} → ${labelOf(m)}${m.annotation_type&&!m.reviewed?'（待确认）':''}`});
 $('#mapping-table').innerHTML=q.states.map(s=>{const m=saved.mappings[s.id];return `<tr><td>状态 ${s.id}</td><td>${esc(labelOf(m))}</td><td>${m.reviewed?'已确认':m.annotation_type?'已选择，待确认':'待定义'}</td></tr>`}).join('');}
function persist(){try{localStorage.setItem(key,JSON.stringify(saved))}catch(e){$('#status').textContent='浏览器无法保存，请及时导出文件。'}update()}
function live(){if(!player||!currentClip)return;const frame=Math.min(Math.floor(player.currentTime*q.fps+1e-4),Math.round(player.duration*q.fps)-1),r=q.clip_runs[currentClip].find(r=>frame>=r.start_frame&&frame<r.end_frame_exclusive);if(!r)return;const m=saved.mappings[r.state];$('#live').textContent=`当前帧：状态 ${r.state} · ${labelOf(m)}${m?.annotation_type&&!m.reviewed?'（待确认）':''} · ${player.currentTime.toFixed(2)}秒`;}
function timeline(){const runs=q.clip_runs[currentClip]||[];$('#timeline').innerHTML=runs.map((r,i)=>{const m=saved.mappings[r.state];return `<button data-run="${i}" title="${(r.start_frame/q.fps).toFixed(2)}–${(r.end_frame_exclusive/q.fps).toFixed(2)}秒">S${r.state}${m?.reviewed?' · '+esc(labelOf(m)):''}</button>`}).join('');}
async function loadExample(i,play=false,context=false){const e=selectedState().examples[i];currentExample=i;stopAt=null;
 const thisPlayer=player;if(currentClip!==e.clip_id){currentClip=e.clip_id;thisPlayer.src=e.video;thisPlayer.load();await new Promise((resolve,reject)=>{thisPlayer.addEventListener('loadedmetadata',resolve,{once:true});thisPlayer.addEventListener('error',reject,{once:true})});}if(thisPlayer!==player)return;
 const a=context?Math.max(0,e.start_seconds-.3):e.start_seconds,b=context?Math.min(player.duration,e.end_seconds+.3):e.end_seconds;
 player.currentTime=a;stopAt=b;$('#example-info').textContent=`样例 ${i+1}：${e.clip_id} · 状态 ${saved.active} 的原区间 ${e.start_seconds.toFixed(2)}–${e.end_seconds.toFixed(2)}秒`;
 [...$('#examples').children].forEach((b,j)=>b.setAttribute('aria-pressed',String(j===i)));timeline();live();if(play)await player.play();
}
function choose(phase){Object.assign(definition(),{annotation_type:'single',phase,mixed_phases:[],reviewed:false});persist();renderChoices();live();timeline();}
function chooseKind(kind){const m=definition();m.annotation_type=kind;m.reviewed=false;if(kind!=='single')m.phase='';if(kind!=='mixed')m.mixed_phases=[];persist();renderChoices();live();timeline();}
function renderChoices(){const m=definition();$('#kind-choices').innerHTML=Object.entries(kinds).map(([kind,title])=>`<button type="button" role="radio" aria-checked="${m.annotation_type===kind}" data-kind="${kind}">${title}</button>`).join('');
 const mixed=m.annotation_type==='mixed';$('#choices').innerHTML=['','single','mixed'].includes(m.annotation_type)?q.phase_schema.definitions.map(p=>`<button type="button" role="${mixed?'checkbox':'radio'}" aria-checked="${mixed?m.mixed_phases.includes(p.label):m.phase===p.label}" ${mixed?'data-mixed':'data-phase'}="${p.label}" style="--bg:${p.background};--fg:${p.color}" title="${esc(p.description)}">${p.label}</button>`).join(''):'';
 $('#choices').setAttribute('role',mixed?'group':'radiogroup');$('#type-hint').textContent=mixed?'选择该状态包含的两个或更多阶段。保留混合标识，不会强制归入其中某一个阶段。':m.annotation_type==='invalid'?'本状态将标记为无效并排除出单阶段标签；原始状态与帧号仍保留。':m.annotation_type==='uncertain'?'确认“无法判断”后，保留待复核标识，不作为单阶段训练标签。':'单一阶段选择一个名称；多个模型状态可以使用同一个阶段名称。';
 $('#confirm-status').textContent=m.reviewed?'本状态标识已由你确认':m.annotation_type?'已选择标识，请确认本状态':'请选择状态类型或动作阶段';}
function render(){if(player)player.pause();const s=selectedState(),m=definition();currentClip=null;currentExample=0;stopAt=null;
 $('#panel').innerHTML=`<h2>原始状态 ${s.id}</h2><p class="muted">共${s.frames}帧（${(s.frames/q.fps).toFixed(2)}秒），${s.runs}次连续出现。下方片段都来自同一个状态编号。</p><div id="kind-choices" class="kind-choices row" role="radiogroup" aria-label="状态${s.id}标识类型"></div><p id="type-hint" class="type-hint"></p><div class="choices row" id="choices" role="radiogroup" aria-label="状态${s.id}对应动作阶段"></div><div class="row" style="margin-top:12px"><button id="confirm" class="primary">确认本状态的标识</button><button id="clear">暂不定义</button><strong id="confirm-status"></strong></div>
 <label>备注 <input class="notes" id="notes" aria-label="状态备注" value="${esc(m.notes)}" placeholder="可记录状态中的例外或混合阶段"></label>
 <div class="preview"><video controls preload="metadata" playsinline></video></div><p id="live" class="live"></p><p id="example-info" class="muted"></p>
 <div class="row"><button id="play">播放这个状态片段</button><button id="context-play">播放及前后上下文</button><button id="whole">播放当前整段视频</button><label>速度 <select id="speed" aria-label="播放速度"><option value="1">1倍</option><option value=".5">0.5倍</option><option value=".25">0.25倍</option></select></label></div>
 <div id="timeline" class="timeline" aria-label="原始状态时间线"></div><div id="examples" class="examples">${s.examples.map((e,i)=>`<button data-example="${i}" aria-pressed="${i===0}"><img src="${e.image}" alt="原始状态${s.id}样例${i+1}"><span>${esc(e.clip_id)} · ${e.start_seconds.toFixed(2)}–${e.end_seconds.toFixed(2)}秒</span></button>`).join('')}</div>
 <div class="row between" style="margin-top:18px"><button id="prev"${q.states[0].id===s.id?' disabled':''}>← 上一个状态</button><button id="next"${q.states.at(-1).id===s.id?' disabled':''}>下一个状态 →</button></div>`;
 player=$('#panel video');player.addEventListener('timeupdate',()=>{live();if(stopAt!==null&&player.currentTime>=stopAt){player.pause();stopAt=null}});renderChoices();
 $('#kind-choices').onclick=e=>{const b=e.target.closest('[data-kind]');if(b)chooseKind(b.dataset.kind)};
 $('#choices').onclick=e=>{const single=e.target.closest('[data-phase]');if(single){choose(single.dataset.phase);return}const b=e.target.closest('[data-mixed]');if(b){const phase=b.dataset.mixed;m.mixed_phases=m.mixed_phases.includes(phase)?m.mixed_phases.filter(p=>p!==phase):phases.filter(p=>p===phase||m.mixed_phases.includes(p));m.reviewed=false;persist();renderChoices();live();timeline()}};
 $('#confirm').onclick=()=>{if(!complete(m)){$('#status').textContent=m.annotation_type==='mixed'?'混合阶段请至少选择两个动作阶段。':'请先选择动作阶段或标识类型；也可以暂不定义此状态。';return}m.reviewed=true;persist();renderChoices();timeline();live();$('#status').textContent=`状态 ${s.id} 已确认标识为“${labelOf(m)}”。`};
 $('#clear').onclick=()=>{Object.assign(m,{annotation_type:'',phase:'',mixed_phases:[],reviewed:false});persist();renderChoices();timeline();live()};$('#notes').oninput=()=>{m.notes=$('#notes').value;persist()};
 $('#play').onclick=()=>loadExample(currentExample,true).catch(()=>{$('#status').textContent='视频播放失败，请稍后重试。'});$('#context-play').onclick=()=>loadExample(currentExample,true,true).catch(()=>{$('#status').textContent='视频播放失败。'});
 $('#whole').onclick=async()=>{stopAt=null;player.currentTime=0;await player.play()};$('#speed').onchange=()=>{player.playbackRate=Number($('#speed').value)};
 $('#examples').onclick=e=>{const b=e.target.closest('[data-example]');if(b)loadExample(Number(b.dataset.example),true).catch(()=>{$('#status').textContent='视频播放失败。'})};
 $('#timeline').onclick=async e=>{const b=e.target.closest('[data-run]');if(!b)return;const r=q.clip_runs[currentClip][Number(b.dataset.run)];player.currentTime=r.start_frame/q.fps;stopAt=r.end_frame_exclusive/q.fps;await player.play()};
 const index=q.states.indexOf(s);$('#prev').onclick=()=>activate(index-1);$('#next').onclick=()=>activate(index+1);loadExample(0).catch(()=>{$('#status').textContent='当前视频无法读取，请查看缩略图或选择另一个片段。'});update();
}
function activate(i){if(i<0||i>=q.states.length)return;saved.active=q.states[i].id;persist();render()}
for(const [i,s] of q.states.entries()){const b=document.createElement('button');b.onclick=()=>activate(i);$('#states').appendChild(b)}
$('#context').textContent=q.title_context+' · 当前模型的状态与边界保持原样';
$('#export').onclick=()=>{const payload={schema_version:2,created_at:new Date().toISOString(),mapping_key:q.mapping_key,dataset:q.dataset,model:q.model,checkpoint_sha256:q.checkpoint_sha256,fps:q.fps,
 phase_schema:q.phase_schema,mappings:q.states.map(s=>{const m=saved.mappings[s.id];return {state:s.id,annotation_type:m.annotation_type,phase:m.phase||null,mixed_phases:m.mixed_phases,reviewed:m.reviewed,notes:m.notes,usable_for_single_phase:Boolean(m.reviewed&&m.annotation_type==='single'&&phases.includes(m.phase)),excluded:Boolean(m.reviewed&&m.annotation_type==='invalid')}}),label_source:'user-defined state annotations'};
 const url=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download=q.mode==='single'?'camera05-old-model-state-names.json':'camera05-81clip-model-state-names.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);$('#status').textContent='已导出。将JSON文件发回聊天，即可应用你确认的名称。';};
$('#import').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;const p=JSON.parse(await f.text());for(const k of ['mapping_key','dataset','model','checkpoint_sha256','fps'])if(p[k]!==q[k])throw Error('这份命名属于另一模型，不能直接套用');if(!Array.isArray(p.mappings)||p.mappings.length!==q.states.length||new Set(p.mappings.map(m=>m.state)).size!==q.states.length)throw Error('状态数量或编号不匹配');const restored={};
for(const m of p.mappings){const kind=m.annotation_type??(phases.includes(m.phase)?'single':''),mixed=m.mixed_phases??[];if(!q.states.some(s=>s.id===m.state)||![null,'',...phases].includes(m.phase)||typeof m.reviewed!=='boolean'||!['',...Object.keys(kinds)].includes(kind)||!Array.isArray(mixed)||new Set(mixed).size!==mixed.length||mixed.some(v=>!phases.includes(v))||kind!=='single'&&m.phase||kind!=='mixed'&&mixed.length||m.reviewed&&(kind==='single'?!phases.includes(m.phase):kind==='mixed'?mixed.length<2:!['invalid','uncertain'].includes(kind)))throw Error('状态类型、阶段或确认情况不合法');restored[m.state]={annotation_type:kind,phase:m.phase||'',mixed_phases:mixed,reviewed:m.reviewed,notes:String(m.notes||'')}}saved.mappings=restored;persist();render();$('#status').textContent='状态标识已恢复。';}catch(error){$('#status').textContent='无法恢复：'+error.message}e.target.value=''};
persist();render();
</script></body></html>
